[package]
name = "keystra"
version = "0.1.0"
description = "A clean settings app for the Cherry Xtrfy MX 8.2 Pro TMR keyboard"
authors = ["Vultify <233528661+Vultify@users.noreply.github.com>"]
license = "MIT"
edition = "2024"
rust-version = "1.90"

# The app logic and its unit tests live in this library; main.rs just calls run().
# Windows only, so it builds as a plain Rust library (the mobile staticlib and cdylib outputs are dropped).
[lib]
name = "keystra_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hidapi = "2.6.7"
log = "0.4.35"
tauri-plugin-log = "2.10.2"
thiserror = "2.0.21"
windows-sys = { version = "0.61", features = ["Win32_Devices_DeviceAndDriverInstallation", "Win32_Devices_HumanInterfaceDevice", "Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading"] }
tauri-plugin-single-instance = "2.5.5"
auto-launch = "0.6.0"

# Small, fast release builds.
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
strum = { version = "0.28.0", features = ["derive"] }
ts-rs = "12.0.1"
